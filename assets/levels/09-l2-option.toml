[[level]]
id = "l2-option"
title = "Option 与 get"
tier = "l2"
description = "v.get(5) 返回 None（越界），当前输出 none。修改参数使输出 3，并体会 Option 的 match 处理。"
hint = "v.get(2) 返回 Some(3)，match 的 Some 分支会打印 3。"
starter_code = '''
fn main() {
    let v = vec![1, 2, 3];
    let item = v.get(5);
    match item {
        Some(x) => println!("{}", x),
        None => println!("none"),
    }
}
'''
expect_output = "3"
source = "rustlings (option1)"
