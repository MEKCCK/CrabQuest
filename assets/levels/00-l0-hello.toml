[[level]]
id = "l0-hello"
title = "你好，变量"
tier = "l0"
description = "代码无法编译：变量 x 未声明就被赋值。目标输出「x has the value 5」。涉及概念：变量声明。"
hint = "变量在使用前必须先声明（绑定），未声明的名字无法引用。"
hints = [
  "变量在使用前必须先声明（绑定），未声明的名字无法引用。",
  "错误 E0425 指向未声明的名字。见 book-cn ch03-01「变量与可变性」：https://rustwiki.org/zh-CN/book/ch03-01-variables-and-mutability.html",
  "let x = 5;\n在赋值语句前加 let 声明变量。",
]
starter_code = '''
fn main() {
    x = 5;
    println!("x has the value {}", x);
}
'''
expect_output = "x has the value 5"
source = "rustlings (exercises/01_variables/variables1.rs, v6.5.0, MIT)"
