[[level]]
id = "l1-clone"
title = "克隆 vs 移动"
tier = "l1"
description = "let s2 = s1 把所有权移给了 s2，s1 无法再用。目标输出「hello hello」。涉及概念：克隆（Clone）。"
hint = "移动（move）后原变量失效，保留原值需复制数据。"
hints = [
  "移动（move）后原变量失效，保留原值需复制数据。",
  "错误 E0382：s1 在绑定给 s2 后被移动。见 book-cn ch04-01「所有权」：https://rustwiki.org/zh-CN/book/ch04-01-what-is-ownership.html",
  "let s2 = s1.clone();\n克隆 s1 后再绑定，两个变量各有数据。",
]
starter_code = '''
fn main() {
    let s1 = String::from("hello");
    let s2 = s1;
    println!("{} {}", s1, s2);
}
'''
expect_output = "hello hello"
source = "rustlings (exercises/06_move_semantics/move_semantics5.rs, v6.5.0, MIT，主题改编)"
