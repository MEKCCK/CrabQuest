[[level]]
id = "l1-clone"
title = "克隆 vs 移动"
tier = "l1"
description = "let s2 = s1 把所有权移给了 s2，s1 无法再用。让两个变量都可使用。"
hint = "使用 s1.clone() 创建副本：let s2 = s1.clone();"
starter_code = '''
fn main() {
    let s1 = String::from("hello");
    let s2 = s1;
    println!("{} {}", s1, s2);
}
'''
expect_output = "hello hello"
source = "rustlings (move_semantics 系列)"
