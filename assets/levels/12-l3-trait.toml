[[level]]
id = "l3-trait"
title = "实现 Trait"
tier = "l3"
is_boss = true
description = "前置回顾：trait 定义方法签名；impl Trait for 类型实现方法；调用方法要求满足 trait bound。\n\nRectangle 调用了 r.area()，但 Area trait 还没有为 Rectangle 实现。补上 impl。"
hint = "实现 impl Area for Rectangle { fn area(&self) -> u32 { self.width * self.height } }"
starter_code = '''
struct Rectangle {
    width: u32,
    height: u32,
}

trait Area {
    fn area(&self) -> u32;
}

fn main() {
    let r = Rectangle { width: 4, height: 5 };
    println!("area: {}", r.area());
}
'''
expect_output = "area: 20"
source = "rustlings (traits 系列)"
