[[level]]
id = "l4-drop-order"
title = "挑战：Drop 释放顺序"
tier = "l4"
description = "写出代码，使输出依次为 end、drop 2、drop 1。提示：给结构体实现 Drop trait，局部变量按声明逆序释放（后声明的先释放）。"
hint = "struct S(u32) + impl Drop for S 打印 drop {}，main 中先创建 S(1) 再创建 S(2)，最后 println!(\"end\")。"
starter_code = '''
fn main() {
    println!("drop 1");
    println!("drop 2");
    println!("end");
}
'''
expect_output = '''
end
drop 2
drop 1
'''
source = "rust-quiz (drop 顺序主题)"
