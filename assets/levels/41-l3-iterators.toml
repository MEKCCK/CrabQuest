[[level]]
id = "l3-iterators"
title = "迭代器：用迭代器实现阶乘"
tier = "l3"
description = "factorial 函数体为空，声明返回 u64 却未返回任何值，编译失败。目标输出三行阶乘：0! = 1、5! = 120、10! = 3628800。涉及概念：迭代器。"
hint = "函数体必须返回 u64 类型的结果。"
hints = [
  "函数体必须产出与返回类型匹配的值。",
  "错误 E0308：函数体为空，隐式返回 ()，与签名 u64 不符。见 book-cn ch13-02「迭代器」：https://rustwiki.org/zh-CN/book/ch13-02-iterators.html",
  "(1..=num).product()\n范围 1..=num 是迭代器，product() 求所有元素乘积；空范围结果为 1。",
]
starter_code = '''
fn factorial(num: u64) -> u64 {
    // TODO: 完成实现
}

fn main() {
    println!("0! = {}", factorial(0));
    println!("5! = {}", factorial(5));
    println!("10! = {}", factorial(10));
}
'''
expect_output = '''0! = 1
5! = 120
10! = 3628800'''
source = "rustlings (exercises/18_iterators/iterators4.rs, v6.5.0, MIT，R1 改写：tests 搬 main)"
