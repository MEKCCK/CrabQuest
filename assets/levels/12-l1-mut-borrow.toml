[[level]]
id = "l1-mut-borrow"
title = "可变借用"
tier = "l1"
description = "add_world 要在 s 上追加内容，但当前代码无法编译。目标输出「hello world」。涉及概念：可变借用。"
hint = "修改数据需要可变借用，只读借用不够。"
hints = [
  "修改数据需要可变借用，只读借用不够。",
  "错误 E0382/E0596 指向 add_world：参数与变量需可变。见 book-cn ch04-02「引用与借用」：https://rustwiki.org/zh-CN/book/ch04-02-references-and-borrowing.html",
  "let mut s = String::from(\"hello\");\nadd_world(&mut s);\nfn add_world(s: &mut String)\n三处：let mut 声明、&mut 调用、&mut 签名。",
]
starter_code = '''
fn main() {
    let s = String::from("hello");
    add_world(s);
    println!("{}", s);
}

fn add_world(s: String) {
    s.push_str(" world");
}
'''
expect_output = "hello world"
source = "自编 (可变借用练习，无原题)"
