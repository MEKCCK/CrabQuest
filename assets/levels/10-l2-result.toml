[[level]]
id = "l2-result"
title = "Result 与错误处理"
tier = "l2"
is_boss = true
description = "前置回顾：Result 表示可能失败的值；模式匹配解出 Ok/Err 分支；`?` 运算符自动传播错误；unwrap/expect 遇错直接 panic。\n\nparse_number 返回 Result；main 返回 () 时无法用 `?` 展开，编译报错。目标输出「解析失败」。"
hint = "把 Err 分支单独处理：解析失败时打印 FAIL_MSG 常量（无需手输中文）。"
starter_code = '''
const FAIL_MSG: &str = "解析失败";

fn main() {
    let result = parse_number("not a number");
    println!("{}", result?);
}

fn parse_number(s: &str) -> Result<i32, std::num::ParseIntError> {
    s.parse()
}
'''
expect_output = "解析失败"
source = "rustlings (result 系列)"
